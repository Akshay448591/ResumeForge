name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Quality Gate (Linting, TypeScript Typecheck, and Automated Tests)
  # ----------------------------------------------------------------------------
  quality-check:
    name: 🧪 Quality Gate (Lint, Typecheck & Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Codebase
        run: npm run lint

      - name: Verify TypeScript Types
        run: npm run typecheck

      - name: Install Playwright Chromium for PDF Tests
        run: npm run pdf:setup

      - name: Run Test Suite
        run: npm test

  # ----------------------------------------------------------------------------
  # Job 2: Validate Docker Image Build
  # ----------------------------------------------------------------------------
  docker-validation:
    name: 🐳 Docker Container Build
    needs: quality-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Unified Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: resumeforge:latest

  # ----------------------------------------------------------------------------
  # Job 3: Continuous Deployment (Trigger Render Live URL Update)
  # ----------------------------------------------------------------------------
  deploy-to-render:
    name: 🚀 Deploy to Live Render URL
    needs: [quality-check, docker-validation]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            echo "🚀 Triggering Render deployment hook..."
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$DEPLOY_HOOK")
            HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
            echo "Response: $RESPONSE"
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "✅ Deployment triggered successfully on Render!"
            else
              echo "❌ Deploy hook returned HTTP status $HTTP_STATUS"
              exit 1
            fi
          else
            echo "ℹ️ Notice: RENDER_DEPLOY_HOOK_URL secret is not set in GitHub repository settings."
            echo "👉 If auto-deploy is enabled in your Render dashboard, Render will automatically detect this commit and rebuild."
            echo "👉 To trigger deployments directly from this GitHub Action, add RENDER_DEPLOY_HOOK_URL to: Repo -> Settings -> Secrets and variables -> Actions."
          fi
